[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "afri2labels"
version = "0.2.0"
description = "afri2labels: Multimodal Foundation Model mapping African Speech Audio & Text directly to English Noun Phrases, Named Entities, and Action Verbs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "torchaudio",
    "transformers",
    "sentence-transformers>=6.1.0",
    "datasets",
    "spacy>=3.7.0",
    "soundfile>=0.12.0",
    "soxr>=0.4.0",
    "numpy",
    "pandas",
    "pyarrow",
]

[tool.setuptools.packages.find]
where = ["src"]
