[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "africlassifier"
version = "0.3.0"
description = "africlassifier: CPU-first Foundation Model for African Speech and Text Classification into English & French AfricaNouns"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "torchaudio",
    "transformers",
    "sentence-transformers>=6.1.0",
    "datasets",
    "spacy>=3.7.0",
    "soundfile>=0.12.0",
    "soxr>=0.4.0",
    "numpy",
    "pandas",
    "pyarrow",
]

[project.optional-dependencies]
server = ["fastapi", "uvicorn", "python-multipart"]

[project.scripts]
afri-infer = "africlassifier.infer:main"
afri-server = "africlassifier.server:main"

[tool.setuptools.packages.find]
where = ["src"]
