[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speech2labels"
version = "0.1.0"
description = "speech2labels: Multimodal EmbeddingGemma 2 mapping African speech directly to English noun phrases, named entities, and action verbs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "torchaudio",
    "transformers",
    "sentence-transformers>=6.1.0",
    "datasets",
    "spacy>=3.7.0",
    "soundfile>=0.12.0",
    "soxr>=0.4.0",
    "numpy",
    "pandas",
    "pyarrow",
]

[tool.setuptools.packages.find]
where = ["src"]
